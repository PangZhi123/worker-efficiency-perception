[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-efficiency-perception"
version = "0.1.0"
description = "YOLO pose tracking backend for construction worker efficiency perception"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
work_efficiency_perception = ["web/*.html", "web/*.css", "web/*.js"]
